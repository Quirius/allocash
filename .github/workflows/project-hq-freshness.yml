name: Project HQ reporting freshness

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'

permissions:
  contents: read

jobs:
  report-freshness:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Project HQ report freshness
        run: python3 scripts/check_project_hq_freshness.py
