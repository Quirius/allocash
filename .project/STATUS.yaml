schema_version: 1
project_id: "allocash"
name: "Allocash"
repository: "Quirius/allocash"
status: "In Progress"
description: "Offline Windows desktop budgeting app for one local HUF budget."
objective: "Reach a migration-ready local budgeting workflow by 2026-10-21, before the owner's vacation, while preserving YNAB history and reproducing balances, Plan values, and migration-critical reports."
phase: "Priority #1 — migration readiness by 2026-10-21"
progress:
  percent: 76
  basis: "manual"
  rationale: "Migration-readiness estimate using the owner-approved weighted model: accounting/import 30/30, Plan and credit-card correctness 20/20, historical reports/data integrity 10/10, daily workflow usability 6/15, backup and tested restore 9/10, Windows installer/release 1/5, full clean migration rehearsal 0/10. Reassess only when one of these migration gates materially changes."
next_action: "Check transfer payee retargeting, normal/transfer conversion, paired Save/Cancel and undo, alongside account creation, status toggles and scheduled realization, and collect remaining dropdown and secondary-screen references; confirm account editing and amount keyboard behavior; check credit payment breakdowns and warnings; check upcoming repeating Save/Cancel/undo and continue target/recurrence recreation and native backup/reopen checks."
updated_at: "2026-10-10T20:35:32Z"
source:
  branch: "main"
  commit: "01d30987cb47ee4a154f273841302b77da5e7c0b"
  verified_at: "2026-10-10T20:35:32Z"
summary:
  completed:
    - "Credit payment mapping controls moved from Plan into collapsed advanced Budget and backups settings. Existing links and automatic per-card payment-category creation remain unchanged. Settings load on expansion and guard stale, pending and restore-time writes. All 249 frontend tests, synthetic browser checks and production/native builds passed. Installation preserved budget bytes, matches the release executable and reopened a responsive window. Rust accounting and schema are unchanged; owner visual confirmation remains open."
    - "Transfer payees are now freely editable in place. Retargeting preserves both transaction IDs and shared metadata; transfer-to-ordinary removes its mirror, and ordinary-to-transfer creates one. Pending conversions update the recurrence template, category rules follow the final budget boundary, reconciled changes require confirmation, and mirror removal creates a safety backup. Saves are atomic and undoable; Cancel and refresh retries do not duplicate writes. All 249 frontend tests, 203 Rust tests, formatting, Cargo check, independent review, synthetic browser checks and production/native builds passed. Installation preserved budget bytes, matches the release executable and reopened a responsive window. Owner interaction confirmation remains open."
    - "The sidebar now retains visible collapse/reopen controls and Add Account opens a centered nickname, type-picker and signed starting-balance dialog. Existing account kinds handle all supplied subtype labels. Account creation, cleared opening entry and visible credit payment-category mapping are atomic and one undoable action; zero balances create no transaction and failed refreshes retry without duplicate creation. All 239 frontend tests, the full 194-test Rust suite plus a hidden-category mapping regression, formatting, Cargo check, independent review, synthetic browser checks at 700 and 500 pixels, and production/native builds passed. Installation preserved budget bytes, matches the release executable and reopened a responsive window. Owner interaction confirmation remains open."
    - "Clearing icons now use sharp SVG circle/C shapes matching the supplied grey outlined and green filled references. Status changes patch the saved row in place and silently refresh balances without a register reload; scroll and editor inputs stay mounted. Failed writes leave the icon unchanged, and failed balance reads retry without repeating the saved status write. All 222 frontend tests, independent review, synthetic browser node-identity checks and production/native builds passed. Installation preserved budget bytes, matches the release executable and reopened a responsive window. Owner visual confirmation remains open; Rust and schema are unchanged."
    - "Transaction icons now toggle posted non-reconciled entries between Cleared and Uncleared. New manual entries default to Uncleared and generated transfer mirrors to Cleared. Due schedules realize automatically as Cleared in an atomic backed-up undoable batch. Right-click actions and double-click replace row Edit buttons; upcoming clearing controls are hidden, unsupported actions remain disabled, and refresh retries never repeat saved writes. All 221 frontend tests, the 188-test Rust suite plus two date regressions, independent review, synthetic browser checks and production/native builds passed. Installation preserved budget bytes, matches the release executable and reopened a responsive window. Owner interaction acceptance remains open."
    - "The first YNAB-style visual pass adds compact collapsible navigation, dense Plan and register tables, category search and filters, independent group totals/collapse, funding bars and the right details panel. Existing past and future transactions edit in their original row; new transactions open at the top. Save and add another resets after successful save and refresh. Date popups stay within the viewport, pending duplicate submissions are blocked, and refresh retries never repeat a successful write. All 204 frontend tests, independent review, synthetic browser visual checks and production/native builds passed. Installation preserved budget bytes, matches the release executable and reopened a responsive window. Rust accounting and schema are unchanged. Full pixel matching, detailed dropdown and secondary-screen references, and owner visual acceptance remain open."
    - "Accounts now open an Edit Account dialog by right-click, with nickname, persistent notes, working balance adjustment, close/reopen and session undo. Balance adjustments are atomic, use checked integer HUF and reject stale balances; active repeat rules prevent closure. Closed-account deletion requires manual removal of all transactions and transfers first, then confirmation and a safety backup. It removes only empty metadata and orphan repeat definitions and preserves category Plan state and raw imports. All 183 Rust and 186 frontend tests, formatting, independent review and frontend/native builds passed. The installed upgrade preserved budget bytes, matches the release executable and reopened a responsive window; owner account interaction checks remain open."
    - "Categories can now be renamed from the selected Plan sidebar with Save/Enter and Cancel/Escape. Trimmed Unicode names retain stable category IDs and all linked transactions, assignments, targets, notes and credit mappings. Renaming is atomic and undoable and refreshes category options in Register and Reports. Exact SQLite classifier guards prevent changing the special Ready to Assign role. All 172 Rust and 176 frontend tests, formatting, Cargo check, independent review and frontend/native builds passed. The installed upgrade preserved budget bytes, matches the release executable and reopened a responsive window; owner rename, cancel, undo and cross-view name checks remain open."
    - "All eight monetary controls now select their complete value on focus or click. Plain numbers replace the selected amount, operator keys seed a calculation from it, Tab/Enter commit and Escape restores the pre-edit value. The exact bigint parser supports precedence and parentheses and rejects fractional final HUF, malformed expressions, zero division and signed-range overflow. Plan blur saves and form-specific validation/save workflows remain intact. All 170 frontend tests, frontend/native builds and independent review passed, including actual React keyboard and blur events and outflow sign/limit regressions. Installation preserved budget bytes, the installed executable matches the release build and Allocash reopened a responsive window; owner interaction and undo confirmation remain open."
    - "Credit payment categories now show expandable Current Balance and Available for Payment breakdowns with carried funds, assignments, funded spending, payments and other activity. Yellow indicates nonnegative payment availability below card debt, red negative payment availability, and green sufficient funding. Total Underfunded includes debt and any payment deficit. All 169 Rust and 151 frontend tests, formatting, Cargo check, independent review and frontend/native builds passed. The installed upgrade preserved budget bytes, matches the release executable and reopened a responsive window; owner sidebar interaction and warning confirmation remain open."
    - "Mapped credit card payment categories no longer expose targets, target progress or snooze controls. Their sidebar retains Available for Payment, balances and notes. Backend writes reject target creation and snoozing while preserving existing definitions for unmapping and allowing cleanup. Financial derivation and schema are unchanged. All 169 Rust and 147 frontend tests, formatting, Cargo check, review and frontend/native builds passed. Installation subsequently passed after the owner closed the window and its remaining background process was stopped. Budget bytes were unchanged, the installed executable matches the build and a responsive native window reopened; owner credit sidebar confirmation remains open."
    - "The owner confirmed a category target test worked, then found imported upcoming entries lacked Repeat. Eligible future Uncleared ordinary entries and one-off schedules now expose Make repeating and date-picker Repeat. Ordinary entries convert in place on Save, including transfer pairs from either leg, retaining the first date and identity without a duplicate. Existing scheduled edits and past-entry repeating drafts remain supported. All 168 Rust and 147 frontend tests, formatting, review and frontend/native builds passed. The installed upgrade preserved budget bytes and reopened a responsive window; owner upcoming repeat interaction confirmation remains open."
    - "On October 10, the owner confirmed installed account balances and the current month Ready to Assign match their latest YNAB data. This verifies the requested owner-facing balance comparison; it does not complete target/recurrence recreation, additional report comparisons or the full native backup/reopen migration rehearsal."
    - "Same-month Plan saves now keep the table and category sidebar mounted while fresh data loads, preserving selection, scroll and open target details. Stable assignment inputs retain drafts and avoid submitting unchanged canonical values. Current-version guards block stale financial writes; loading replacement remains for initial/month changes. All 145 frontend tests and frontend/native builds passed, with focused code review. Installation preserved budget bytes and reopened a responsive window; the owner confirmed Assigned, target/note and undo updates behave correctly without flashing on October 10; move-specific checks remain open."
    - "Category row clicks and control focus select a category whose balance summary, target progress, editor and month-specific snooze appear in a vertical right sidebar. Notes preserve exact text per category across months, reopening and native backups, with undo, autosave and explicit retry. Auto-Assign is omitted. All 162 Rust and 145 frontend tests, formatting, independent review and frontend/native builds passed. The installed upgrade preserved budget bytes and reopened a responsive window; owner sidebar and notes interaction confirmation remains open."
    - "Plan money moves now open from each category Available amount with that source fixed, a positive-balance amount default and grouped destinations including Ready to Assign. Category moves adjust both Assigned values; returning to Ready to Assign reduces the source assignment and remains undoable. Cancellation, invalid input, repeated saves, failed drafts and stale popup contexts are handled. All 161 Rust and 140 frontend tests, formatting, review and frontend/native builds passed. The installed upgrade preserved budget bytes and reopened a responsive window; owner popup interaction confirmation remains open."
    - "Budget-aware category entry is implemented: off-budget ordinary transactions and internal transfers need none; budget inflows default to Ready to Assign, outflows require an explicit choice, and crossing transfers use only the budget leg from either account. Current and repeating entries, edits, legacy preservation, reconciled confirmation, rollback and undo are checked. All 159 core and 134 frontend tests, review and frontend/native builds passed; the installed upgrade preserved budget bytes and reopened a responsive window. Owner interaction confirmation remains open."
    - "Ctrl+Z and an Undo button now reverse saved desktop budgeting actions, with complete transfers, payees, recurrence, Plan assignments/moves, targets/snoozes, payment mapping and reconciliation restored from verified SQLite states. A 30-step session history clears on reopening or successful backup restore. All 146 core and 117 frontend tests, formatting, review and frontend/native builds passed. The installed upgrade preserved budget bytes and reopened a responsive native window. The owner subsequently confirmed the undo workflow works well; individual shortcut, button and native editing checks were not separately described."
    - "Ready to Assign now includes credit-to-cash advances and newly positive credit balances while avoiding duplicate funding from existing positive balances. Payment-category cash overspending is classified after monthly funding/payment deltas. The captured installed budget now derives zero October Ready to Assign; all 51 category/mapping snapshots remain identical. All 137 core tests, formatting, independent review and frontend/native package builds passed. The installed app was upgraded and reopened, preserving budget bytes and table contents; owner screen confirmation remains open."
    - "Make repeating now selects the next occurrence of the original day strictly after today, using this month when available or next month otherwise and clamping short months. The original day anchor survives clamping unless the proposed date is edited. Sixteen date/draft, 23 routing, 24 IPC, three monthly-schedule and three scheduled-transfer tests passed with formatting, review and frontend/native installer builds. The installed upgrade preserved database bytes and reopened a responsive native window; owner retest remains open."
    - "An earlier owner clarification used one month after the original date; the subsequent next-available-day refinement supersedes that default. This earlier change was validated with Monthly selected and original history untouched. All ten date/draft tests and frontend/native installer builds passed. The installed app was upgraded and reopened; database bytes were unchanged by installation."
    - "Repeat now lives inside the date/calendar dropdown with Never default. Make repeating opens an unsaved monthly draft, preserving details and transfer destination identity; its initial original-date-plus-one-month default was subsequently refined to the next available original day. Nine date/draft, 22 routing, 24 IPC and the register identity test passed with formatting, frontend/native installer builds and independent review. The installed app was upgraded and reopened; installation preserved database bytes. Owner interaction confirmation remains open."
    - "A clean schema-10 candidate was regenerated from the owner-confirmed current export. All 34 account balances, 1,326 Plan rows, 1,734 historical account-month balances, 51 Net Worth totals and supplied Income v Expense comparisons match. Integrity and foreign keys passed; an identical candidate copy is in the installed-app backup list. Four zero-value transfer rows and 43 duplicate signals remain preserved."
    - "The owner accepted the unified upcoming display, closing the migration-critical daily-workflow checks, and confirmed YNAB is unchanged since the October 4 export. The original export was recovered from preserved archive bytes and its hash matches the approved mappings; installed-budget read-only integrity and foreign-key checks passed."
    - "The owner restored the verified rehearsal candidate into the installed app and confirmed register responsiveness and upcoming deletion. Future imported rows exposed a display gap; the register now groups and mutes all pending schedules and future ordinary entries above history, without a separate Scheduled tab. Focused tests, frontend/native installer builds and independent review passed; the installed app was upgraded and reopened with database bytes unchanged by installation."
    - "The per-user x64 installer completed with exit code 0; installed executable, uninstall registration and Start menu shortcut were verified. The installed app opened a responsive native window, and the owner confirmed the normal app screen. Installation and first launch are verified."
    - "Synthetic native desktop startup recovery passed, including desktop reopen, unchanged source backup and exact preservation of unreadable database/WAL bytes. The owner rehearsal budget was untouched. The per-user x64 NSIS installer built successfully; installation and first launch subsequently passed on 2026-10-08."
    - "Upcoming scheduled entries now use the register editor with Date/Repeat and other fields. Edits update pending/future instances while preserving posted history, paired transfers and original recurrence anchors. Delete cancels repeats through the safety-backup path. 129 core tests, 24 IPC tests and the standalone build passed; owner editing and deletion subsequently passed; revised upcoming display subsequently received owner acceptance."
    - "The owner confirmed register Date/Repeat worked but reported heavy lag. Register rendering is now bounded to 100 rows per page with full history accessible; frontend and standalone builds passed and desktop navigation was inspected. Owner responsiveness retesting subsequently passed on 2026-10-08."
    - "The owner reported the new target and scheduled transfer worked, then clarified register-based Date/Repeat entry. The composer now supports Never/Monthly/Quarterly/Yearly, one-time future entries and atomic Post/Skip from either transfer leg. 22 routing tests, 48 ledger tests and the standalone build passed; desktop controls were inspected."
    - "Owner-required monthly, quarterly and yearly category targets and income/expense/transfer schedules are implemented. Periodic targets use explicit due settings and spread funding over months. Schema-10 upgrades and older-backup restore preserve existing data; 122 core tests, 73 frontend tests and the standalone desktop build passed. Existing owner export comparisons remain exact."
    - "The owner confirmed corrected Plan money moves, date-eligible clearing/reconciliation and native backup restore that reverted a test entry and persisted after reopening. Startup recovery and remaining required daily workflows remain open."
    - "Plan money moves now refresh Assigned inputs and may leave Assigned/Available negative, with green highlights. All 16 Plan tests, formatting, frontend and standalone rehearsal builds passed; owner Plan retest passed."
    - "The owner-data candidate passed exact account, Plan and supplied report comparisons. The owner reported restore, backup creation, ordinary entry/edit/delete and corrected transfer-payee entry success."
    - "The YNAB verifier can produce a non-overwriting native rehearsal candidate after explicit mappings and matching references. An anonymized end-to-end import produced a candidate; a mismatched reference produced none. The isolated Windows rehearsal build launched under its own data folder without creating the normal app folder."
    - "Startup recovery can install a verified local backup while preserving an unreadable database and WAL sidecars; healthy databases are refused. Disposable corruption and schema tests passed within 99 desktop Rust tests, alongside 58 frontend tests and the frontend build."
    - "An open budget can restore a validated local backup after saving a verified copy of its current state; a WAL-backed round trip and invalid-source tests passed within 96 Rust tests, alongside 58 frontend tests and the frontend build."
    - "Register corrections cover account, date, payee, category, flag, and ordinary transaction direction while preserving identity and requiring confirmation for reconciled changes; 94 Rust core tests, 58 frontend tests, and the frontend build passed."
    - "Ledger, register, reconciliation, YNAB transaction staging/materialization, monthly Plan, targets, schedules, reports, forecasting, and verified local backup slices are implemented."
    - "A native Windows desktop build and the documented check sequence passed on 2026-09-23."
    - "Historical YNAB Assigned values can be imported atomically; all 1,326 assignments in the 2026-10-04 export materialized in a disposable database."
    - "The matching Net Worth TSV confirmed all 34 account balances exactly for the 2026-10-04 export."
    - "The owner confirmed both credit payment mappings; imported Ready to Assign entries retain their category while Plan routes the cash activity into its separate balance."
    - "The as-of Plan cutoff resolves all six October 2026 differences against the owner's export."
    - "Card purchases fund payment categories in date order after cash and positive-card-balance spending receive category money."
    - "The mapped as-of comparison matches all 1,326 Assigned, Activity, and Available Plan rows across 51 months; all 34 reference account balances also match."
    - "The owner's historical Net Worth reference matches 1,734 account-month balances and 51 monthly totals in the Net Worth and Balance Over Time reports."
    - "The January–October 2026 Income v Expense reference matches all monthly totals, 40 income-source cells, 50 expense-group cells, 200 category cells, and report totals and averages; related report totals match for the same scope."
