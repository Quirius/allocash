# Allocash project-local Codex defaults
#
# The main/coordinator session uses Astra light. Routine model routing uses Luna
# light for straightforward subtasks.

model = "gpt-6-astra"
model_reasoning_effort = "low"

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "low"
